name: Render video

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Render video
        run: npm run render

      - name: Check audio stream
        run: npx remotion ffprobe -v error -select_streams a -show_entries stream=codec_name -of csv=p=0 out/internet-facts.mp4

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: internet-facts-video
          path: out/internet-facts.mp4
          if-no-files-found: error
