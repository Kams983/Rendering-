name: Render Remotion Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install numpy scipy

      - name: Generate SFX
        run: python scripts/make_sfx.py

      - name: Install Node dependencies
        run: npm install

      - name: Install Chromium for Remotion
        run: |
          npx remotion browser ensure
          npx playwright install --with-deps chromium

      - name: Render video
        env:
          REMOTION_CHROME_DISABLE_SANDBOX: "true"
          CI: "true"
        run: |
          npx remotion render EarthStop out/earth-stop.mp4 \
            --chromium-flags="--no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage --disable-gpu --use-gl=swiftshader"

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: earth-stop-video
          path: out/earth-stop.mp4
