name: Render Remotion Video

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition id to render"
        required: true
        default: "InternetFacts"
        type: choice
        options:
          - InternetFacts
          - EarthStop

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install numpy scipy

      - name: Generate SFX
        run: python scripts/make_sfx.py

      - name: Install system libraries for Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libpango-1.0-0 libcairo2 libcups2

      - name: Install Node dependencies
        run: npm install

      - name: Install Chromium for Remotion
        run: npx remotion browser ensure

      - name: Render video
        env:
          REMOTION_CHROME_DISABLE_SANDBOX: "true"
          CI: "true"
        run: npx remotion render ${{ inputs.composition }} out/video.mp4 --gl=angle --concurrency=2

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.composition }}-video
          path: out/video.mp4
          if-no-files-found: error