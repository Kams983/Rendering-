name: Render video

on:
  workflow_dispatch:
    inputs:
      quality:
        description: "Quality tier"
        required: true
        default: ci
        type: choice
        options:
          - ci
          - final
          - preview
      scale:
        description: "Output scale (1 = 1080x1920, 0.5 = half size)"
        required: true
        default: "1"
        type: string
      parts:
        description: "Number of frame shards"
        required: true
        default: "20"
        type: string

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Split 1410 frames into equal parts
        id: plan
        run: |
          node -e '
            const LAST = 1409;
            const parts = Math.max(1, Math.min(60, Number(process.env.PARTS) || 20));
            const chunk = Math.ceil((LAST + 1) / parts);
            const matrix = [];
            for (let part = 0; part < parts; part += 1) {
              const start = part * chunk;
              if (start > LAST) break;
              matrix.push({ part, start, end: Math.min(LAST, start + chunk - 1) });
            }
            console.log(`chunk=${chunk}`);
            console.log(`matrix=${JSON.stringify(matrix)}`);
          '
        env:
          PARTS: ${{ inputs.parts }}

  parts:
    name: part-${{ matrix.part }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install ffmpeg and Chromium libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0t64 \
            libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 \
            libxcomposite1 libxdamage1 libgbm-dev libcups2t64 \
            libatk-bridge2.0-0t64

      - name: Install dependencies
        run: npm ci

      - name: Download Chrome for Remotion
        run: npx remotion browser ensure

      - name: Measure and fit voice-over
        run: npm run voice:prepare

      - name: Render part
        run: |
          set -euo pipefail
          echo "part ${{ matrix.part }}: frames ${{ matrix.start }}-${{ matrix.end }}"
          mkdir -p out
          npx remotion render src/index.ts CodingMistakes3D "out/part-${{ matrix.part }}.mp4" \
            --gl=swangle \
            --concurrency=2 \
            --scale=${{ inputs.scale }} \
            --crf=18 \
            --muted \
            --timeout=600000 \
            --frames=${{ matrix.start }}-${{ matrix.end }} \
            --props=props/${{ inputs.quality }}.json

      - name: Upload part
        uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.part }}
          path: out/part-${{ matrix.part }}.mp4
          if-no-files-found: error

  merge:
    name: merge
    needs: parts
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install ffmpeg and Chromium libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0t64 \
            libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 \
            libxcomposite1 libxdamage1 libgbm-dev libcups2t64 \
            libatk-bridge2.0-0t64

      - name: Install dependencies
        run: npm ci

      - name: Download Chrome for Remotion
        run: npx remotion browser ensure

      - name: Measure and fit voice-over
        run: npm run voice:prepare

      - name: Download parts
        uses: actions/download-artifact@v4
        with:
          pattern: part-*
          merge-multiple: true
          path: out

      - name: Render audio
        run: |
          set -euo pipefail
          npx remotion render src/index.ts CodingMistakes3D out/audio.aac \
            --codec=aac \
            --gl=swangle \
            --timeout=600000 \
            --props=props/${{ inputs.quality }}.json

      - name: Concat parts and mux audio
        run: |
          set -euo pipefail
          : > out/list.txt
          for file in $(ls out/part-*.mp4 | sort -V); do
            test -f "$file" || { echo "missing $file"; exit 1; }
            echo "file '$(basename "$file")'" >> out/list.txt
          done
          cat out/list.txt
          ffmpeg -y -f concat -safe 0 -i out/list.txt -c copy out/video-only.mp4
          ffmpeg -y -i out/video-only.mp4 -i out/audio.aac \
            -c:v copy -c:a aac -b:a 192k -shortest out/final.mp4
          ffprobe -hide_banner -show_entries format=duration,size -of default=noprint_wrappers=1 out/final.mp4

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: out/final.mp4
          if-no-files-found: error
