name: Render New York history video

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx remotion browser ensure
      - run: npx remotion render src/index.ts NewYorkHistory out/new-york.mp4 --gl=swangle
      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: new-york-history
          path: out/new-york.mp4
          if-no-files-found: error
