name: Render Coding Mistakes

on:
  workflow_dispatch:
    inputs:
      quality:
        description: "preview = 540x960 fast check; final = 1620x2880 hero quality"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - final
  push:
    branches:
      - main

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Synthesise SFX and music
        run: npm run gen-audio

      - name: Render video
        env:
          # Pushes render the fast preview; use "Run workflow" for final.
          QUALITY: ${{ inputs.quality || 'preview' }}
        run: |
          set -euo pipefail
          mkdir -p out
          if [ "$QUALITY" = "final" ]; then
            echo "Rendering FINAL (1620x2880, hero quality) — this is slow."
            npx remotion render src/index.ts CodingMistakes3D out/render.mp4 \
              --gl=swangle \
              --concurrency=1 \
              --scale=1.5 \
              --crf=16 \
              --props=props/final.json
          else
            echo "Rendering PREVIEW (540x960)."
            npx remotion render src/index.ts CodingMistakes3D out/render.mp4 \
              --gl=swangle \
              --concurrency=2 \
              --scale=0.5 \
              --props=props/preview.json
          fi

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: coding-mistakes-${{ inputs.quality || 'preview' }}
          path: out/render.mp4
          if-no-files-found: error
