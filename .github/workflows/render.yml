name: Render video

on:
  workflow_dispatch:
    inputs:
      quality:
        description: "Quality tier"
        required: true
        default: ci
        type: choice
        options:
          - ci
          - final
          - preview
      scale:
        description: "Output scale (1 = 1080x1920, 0.5 = half size)"
        required: true
        default: "1"
        type: string
      parts:
        description: "Number of frame shards"
        required: true
        default: "20"
        type: string
      only_part:
        description: "Render only this part number (blank = all parts)"
        required: false
        default: ""
        type: string

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      chunk: ${{ steps.plan.outputs.chunk }}
      full: ${{ steps.plan.outputs.full }}
    steps:
      - name: Build part matrix
        id: plan
        shell: bash
        env:
          PARTS: ${{ inputs.parts }}
          ONLY_PART: ${{ inputs.only_part }}
        run: |
          set -euo pipefail
          LAST=1409
          PARTS="${PARTS:-40}"
          if ! [[ "$PARTS" =~ ^[0-9]+$ ]] || [ "$PARTS" -lt 1 ]; then
            PARTS=40
          fi
          if [ "$PARTS" -gt 60 ]; then
            PARTS=60
          fi
          CHUNK=$(( (LAST + 1 + PARTS - 1) / PARTS ))
          ONLY_PART="$(printf '%s' "$ONLY_PART" | tr -d '[:space:]')"
          if [ -n "$ONLY_PART" ]; then
            if ! [[ "$ONLY_PART" =~ ^[0-9]+$ ]]; then
              echo "only_part must be a number, got '$ONLY_PART'"
              exit 1
            fi
            if [ "$ONLY_PART" -gt $(( PARTS - 1 )) ]; then
              echo "only_part $ONLY_PART out of range for $PARTS parts"
              exit 1
            fi
            MATRIX="[$ONLY_PART]"
            FULL=false
          else
            MATRIX="[$(seq -s, 0 $(( PARTS - 1 )))]"
            FULL=true
          fi
          if [ -z "$MATRIX" ]; then
            echo "matrix would be empty"
            exit 1
          fi
          echo "parts=$PARTS chunk=$CHUNK full=$FULL matrix=$MATRIX"
          {
            echo "matrix=$MATRIX"
            echo "chunk=$CHUNK"
            echo "full=$FULL"
          } >> "$GITHUB_OUTPUT"

  parts:
    name: part-${{ matrix.part }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install ffmpeg and Chromium libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0t64 \
            libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 \
            libxcomposite1 libxdamage1 libgbm-dev libcups2t64 \
            libatk-bridge2.0-0t64

      - name: Install dependencies
        run: npm ci

      - name: Download Chrome for Remotion
        run: npx remotion browser ensure

      - name: Render part
        shell: bash
        env:
          CHUNK: ${{ needs.plan.outputs.chunk }}
          PART: ${{ matrix.part }}
        run: |
          set -euo pipefail
          LAST=1409
          START=$(( PART * CHUNK ))
          END=$(( START + CHUNK - 1 ))
          if [ "$END" -gt "$LAST" ]; then END=$LAST; fi
          if [ "$START" -gt "$LAST" ]; then
            echo "part $PART starts past the last frame ($START > $LAST)"
            exit 1
          fi
          echo "part $PART: frames $START-$END (chunk $CHUNK)"
          mkdir -p out
          TIMEFORMAT='part %3R s'
          time npx remotion render src/index.ts CodingMistakes3D "out/part-$PART.mp4" \
            --gl=swangle \
            --concurrency=2 \
            --scale=${{ inputs.scale }} \
            --crf=18 \
            --muted \
            --timeout=600000 \
            --frames=$START-$END \
            --props=props/${{ inputs.quality }}.json
          echo "part $PART rendered frames $START-$END"

      - name: Upload part
        uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.part }}
          path: out/part-${{ matrix.part }}.mp4
          if-no-files-found: error

  merge:
    name: merge
    needs:
      - plan
      - parts
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install ffmpeg and Chromium libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0t64 \
            libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 \
            libxcomposite1 libxdamage1 libgbm-dev libcups2t64 \
            libatk-bridge2.0-0t64

      - name: Install dependencies
        run: npm ci

      - name: Download Chrome for Remotion
        run: npx remotion browser ensure

      - name: Download parts
        uses: actions/download-artifact@v4
        with:
          pattern: part-*
          merge-multiple: true
          path: out

      - name: Render audio
        run: |
          set -euo pipefail
          npx remotion render src/index.ts CodingMistakes3D out/audio.aac \
            --codec=aac \
            --gl=swangle \
            --timeout=600000 \
            --props=props/${{ inputs.quality }}.json

      - name: Concat parts and mux audio
        run: |
          set -euo pipefail
          : > out/list.txt
          for file in $(ls out/part-*.mp4 | sort -V); do
            test -f "$file" || { echo "missing $file"; exit 1; }
            echo "file '$(basename "$file")'" >> out/list.txt
          done
          cat out/list.txt
          ffmpeg -y -f concat -safe 0 -i out/list.txt -c copy out/video-only.mp4
          ffmpeg -y -i out/video-only.mp4 -i out/audio.aac \
            -c:v copy -c:a aac -b:a 192k -shortest out/final.mp4
          ffprobe -hide_banner -show_entries format=duration,size -of default=noprint_wrappers=1 out/final.mp4

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: out/final.mp4
          if-no-files-found: error
